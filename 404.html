<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link
    id="site-favicon"
    rel="icon"
    href="/assets/dl-logo-dark.png"
    type="image/png"
    data-light-href="/assets/dl-logo-dark.png"
    data-dark-href="/assets/dl-logo-white.png"
  >
  <link rel="stylesheet" href="/styles.css?v=20260814-1">
  <title>页面未找到 · DL Community</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('dl-theme');
      const themeMode = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'auto';
      const resolvedTheme = themeMode === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : themeMode;
      document.documentElement.dataset.themeMode = themeMode;
      if (themeMode !== 'auto') document.documentElement.dataset.theme = themeMode;

      const favicon = document.getElementById('site-favicon');
      favicon.href = favicon.dataset[`${resolvedTheme}Href`];
    } catch (_) {}
  </script>
</head>
<body>
  <main class="error-page">
    <img src="/assets/dlce.png" alt="DL Community" width="64" height="64">
    <p class="section-index">ERROR 404</p>
    <h1>没有找到这个页面</h1>
    <p>链接可能已经失效，或者页面移动到了其他位置。</p>
    <a class="button button-primary" href="/">返回首页 <span class="arrow-mark" aria-hidden="true"></span></a>
  </main>
</body>
</html>
